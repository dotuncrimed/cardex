<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chinese Poker Multiplayer</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">

    <!-- LOGIN -->
    <section id="login-screen" class="screen hidden">
      <div class="panel">
        <h1>Chinese Poker</h1>
        <p class="subtitle">Login with username and PIN.</p>

        <div class="form-group">
          <label>Username</label>
          <input id="login-username" type="text" maxlength="20" autocomplete="off" />
        </div>

        <div class="form-group">
          <label>PIN</label>
          <input id="login-pin" type="password" maxlength="30" />
        </div>

        <button id="login-button" class="primary-button">Login / Register</button>
        <p id="login-error" class="error"></p>
      </div>
    </section>

    <!-- MENU -->
    <section id="menu-screen" class="screen hidden">
      <div class="panel">
        <h1>Chinese Poker</h1>
        <p>Welcome, <strong id="menu-username"></strong></p>
        <p>Cash: <strong id="menu-cash">0</strong></p>

        <button id="show-create-room-button" class="primary-button">Create Room</button>
        <button id="show-join-room-button" class="primary-button">Join Room</button>
        <button id="admin-button" class="secondary-button">Admin</button>
        <button id="logout-button" class="secondary-button">Logout</button>

        <div id="create-room-form" class="hidden panel-sub">
          <h3>Create Room</h3>

          <div class="form-group">
            <label>Minimum Bet</label>
            <input id="create-min-bet" type="number" min="0" value="100" />
          </div>

          <div class="form-group">
            <label>Arrange Timer Seconds</label>
            <input id="create-arrange-timer" type="number" min="0" value="120" />
          </div>

          <div class="form-group">
            <label>Ready Timer Seconds</label>
            <input id="create-ready-timer" type="number" min="0" value="30" />
          </div>

          <div class="form-group">
            <label>Bot Level</label>
            <select id="create-bot-level">
              <option value="easy">Easy</option>
              <option value="normal" selected>Normal</option>
              <option value="hard">Hard</option>
            </select>
          </div>

          <div class="form-group">
            <label>
              <input id="create-auto-fill-bots" type="checkbox" checked />
              Auto-fill empty seats with bots
            </label>
          </div>

          <div class="form-group">
            <label>
              <input id="create-scoop-bonus" type="checkbox" checked />
              Scoop Bonus +3
            </label>
          </div>

          <div class="form-group">
            <label>
              <input id="create-auto-arrange" type="checkbox" />
              Auto-arrange cards (skip manual arrangement)
            </label>
          </div>

          <button id="create-room-button" class="primary-button">Create</button>
          <button id="cancel-create-room-button" class="secondary-button">Cancel</button>
          <p id="create-room-error" class="error"></p>
        </div>

        <div id="join-room-form" class="hidden panel-sub">
          <h3>Join Room</h3>

          <div class="form-group">
            <label>Room Code</label>
            <input id="join-room-code" type="text" maxlength="5" autocomplete="off" />
          </div>

          <button id="join-room-button" class="primary-button">Join</button>
          <button id="cancel-join-room-button" class="secondary-button">Cancel</button>
          <p id="join-room-error" class="error"></p>
        </div>
      </div>
    </section>

    <!-- ROOM -->
    <section id="room-screen" class="screen hidden">
      <div class="pg-table">

        <!-- HUD -->
        <div class="hud">
          <button id="leave-room-button" class="hud-back">←</button>
          <div class="hud-badges">
            <div class="hud-badge">ID <span id="room-code"></span></div>
            <div class="hud-badge">$ <span id="hud-cash">0</span></div>
          </div>
          <button id="room-admin-button" class="hud-back hud-right">⚙</button>
        </div>

        <!-- Mat -->
        <div class="mat"></div>
        <div class="mat-logo">PUSOY</div>

        <!-- Seats -->
        <div class="seat seat-top" id="seat-top"></div>
        <div class="seat seat-left" id="seat-left"></div>
        <div class="seat seat-right" id="seat-right"></div>
        <div class="seat seat-bottom" id="seat-bottom"></div>

        <!-- Opponent card-back clusters -->
        <div class="cluster cluster-top hidden" id="cluster-top"></div>
        <div class="cluster cluster-left hidden" id="cluster-left"></div>
        <div class="cluster cluster-right hidden" id="cluster-right"></div>

        <!-- Center -->
        <div class="table-center">
          <div class="pg-timer hidden" id="pg-timer">--</div>
        </div>
        <div class="banner hidden" id="banner">Start</div>

        <div id="room-message" class="pg-message"></div>

        <!-- hidden legacy -->
        <div class="hidden">
          <span id="room-status"></span>
          <span id="room-round"></span>
          <span id="room-min-bet"></span>
          <span id="room-pot"></span>
          <span id="room-bot-level"></span>
          <span id="room-timer"></span>
          <span id="pg-round"></span>
          <span id="pg-pot"></span>
          <div id="pg-seats"></div>
          <div id="hand-cards"></div>
          <div id="front-cards"></div>
          <div id="middle-cards"></div>
          <div id="back-cards"></div>
          <button id="assign-front-button"></button>
          <button id="assign-middle-button"></button>
          <button id="assign-back-button"></button>
        </div>

        <!-- LOBBY -->
        <div id="lobby-section" class="pg-panel hidden">
          <h3>Lobby</h3>
          <div id="player-list" class="pg-list"></div>
          <div id="spectator-list" class="pg-list"></div>
          <div class="pg-actions">
            <button id="start-room-button" class="pg-btn primary hidden">Start Game</button>
            <button id="fill-bots-button" class="pg-btn hidden">Fill Bots</button>
            <button id="take-seat-button" class="pg-btn primary hidden">Take Seat</button>
          </div>
        </div>

        <!-- ARRANGE (your 3 rows on the table) -->
        <div id="arrange-section" class="hidden">
          <div id="arrange-status" class="pg-message"></div>

          <div class="my-rows">
            <div class="my-row">
              <div class="row-label" id="label-front"></div>
              <div class="row-cards" id="row-front"></div>
            </div>
            <div class="my-row">
              <div class="row-label" id="label-middle"></div>
              <div class="row-cards" id="row-middle"></div>
            </div>
            <div class="my-row">
              <div class="row-label" id="label-back"></div>
              <div class="row-cards" id="row-back"></div>
            </div>
          </div>

          <div class="arrange-controls">
            <button id="auto-arrange-button" class="pg-btn">Auto</button>
            <button id="clear-arrangement-button" class="pg-btn">Reset</button>
            <button id="submit-arrangement-button" class="ready-btn">Ready</button>
          </div>
        </div>

        <!-- REVEAL / COMPARE LAYER -->
        <div id="reveal-layer" class="reveal-layer hidden">
          <button id="reveal-skip" class="pg-btn hidden">Skip ▸▸</button>

          <div class="reveal-slot reveal-top" id="reveal-top"></div>
          <div class="reveal-slot reveal-left" id="reveal-left"></div>
          <div class="reveal-slot reveal-right" id="reveal-right"></div>
          <div class="reveal-slot reveal-bottom" id="reveal-bottom"></div>

          <div class="score-panel" id="score-panel">
            <div class="sp-row"><span>Front:</span><span id="sp-front"></span></div>
            <div class="sp-row"><span>Mid:</span><span id="sp-mid"></span></div>
            <div class="sp-row"><span>Back:</span><span id="sp-back"></span></div>
            <div class="sp-row sp-total"><span>Total:</span><span id="sp-total"></span></div>
          </div>

          <div id="ready-area" class="ready-area hidden">
            <div id="ready-list" class="pg-ready-list"></div>
            <div class="pg-actions">
              <button id="ready-button" class="ready-btn hidden">Ready for Next Round</button>
              <button id="force-start-button" class="pg-btn hidden">Force Start</button>
              <button id="view-results-button" class="pg-btn">View Full Results</button>
              <button id="exit-room-button" class="pg-btn">Exit Room</button>
            </div>
          </div>
        </div>

        <!-- RESULTS -->
        <div id="results-section" class="pg-panel hidden">
          <button id="close-results-button" class="close-panel-btn" title="Close">✕</button>
          <div id="result-summary" class="pg-result-summary"></div>
          <div id="result-boards" class="pg-boards"></div>

          <div class="hidden">
            <table id="result-table"></table>
            <div id="result-details"></div>
          </div>
        </div>

      </div>
    </section>

    <!-- ADMIN -->
    <section id="admin-screen" class="screen hidden">
      <div class="panel wide-panel">
        <h2>Admin Panel</h2>
        <button id="admin-back-button" class="small-button">Back</button>

        <div class="admin-grid">
          <div class="admin-section">
            <h3>Player Management</h3>

            <div class="form-group">
              <label>Username</label>
              <input id="admin-player-username" type="text" autocomplete="off" />
            </div>

            <button id="admin-load-player-button" class="secondary-button">Load Player</button>

            <div id="admin-player-info" class="panel-sub"></div>

            <div class="form-group">
              <label>Display Name</label>
              <input id="admin-display-name" type="text" />
            </div>

            <button id="admin-save-name-button" class="secondary-button">Save Display Name</button>

            <div class="form-group">
              <label>Cash Amount</label>
              <input id="admin-cash-amount" type="number" />
            </div>

            <div class="form-group">
              <label>Reason</label>
              <input id="admin-cash-reason" type="text" />
            </div>

            <div class="controls">
              <button id="admin-add-cash-button" class="secondary-button">Add Cash</button>
              <button id="admin-deduct-cash-button" class="secondary-button">Deduct Cash</button>
              <button id="admin-set-cash-button" class="secondary-button">Set Cash</button>
            </div>
          </div>

          <div class="admin-section">
            <h3>Current Room Settings</h3>

            <div class="form-group">
              <label>Minimum Bet</label>
              <input id="admin-room-min-bet" type="number" />
            </div>

            <div class="form-group">
              <label>Bot Level</label>
              <select id="admin-room-bot-level">
                <option value="easy">Easy</option>
                <option value="normal">Normal</option>
                <option value="hard">Hard</option>
              </select>
            </div>

            <div class="form-group">
              <label>Arrange Timer Seconds</label>
              <input id="admin-room-arrange-timer" type="number" />
            </div>

            <div class="form-group">
              <label>Ready Timer Seconds</label>
              <input id="admin-room-ready-timer" type="number" />
            </div>

            <div class="form-group">
              <label>
                <input id="admin-room-auto-fill-bots" type="checkbox" />
                Auto-fill bots
              </label>
            </div>

            <div class="form-group">
              <label>
                <input id="admin-room-scoop-bonus" type="checkbox" />
                Scoop bonus +3
              </label>
            </div>

            <div class="controls">
              <button id="admin-save-room-button" class="secondary-button">Save Room Settings</button>
              <button id="admin-fill-bots-button" class="secondary-button">Fill Bots</button>
              <button id="admin-force-start-button" class="secondary-button">Force Start / Next Round</button>
            </div>
          </div>
        </div>

        <p id="admin-message" class="message"></p>
      </div>
    </section>

  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
